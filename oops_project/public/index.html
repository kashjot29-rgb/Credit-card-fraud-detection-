 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Risk Assessment System</title>

<style>
:root{
    --bg:#0b1120;
    --panel:#111827;
    --card:#1e293b;
    --border:#334155;
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#3b82f6;
    --accent2:#6366f1;
}

*{
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    margin:0;
    background:radial-gradient(circle at top right,#1e1b4b 0%,var(--bg) 55%);
    color:var(--text);
    min-height:100vh;
    padding:25px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:20px;
    border-bottom:1px solid var(--border);
    padding-bottom:15px;
}

.title{
    margin:0;
}

.subtitle{
    color:var(--muted);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1.1fr;
    gap:20px;
}

.card{
    background:rgba(30,41,59,.9);
    padding:20px;
    border-radius:14px;
    border:1px solid var(--border);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.full{
    grid-column:1 / -1;
}

label{
    display:block;
    margin-bottom:5px;
    color:var(--muted);
    font-size:14px;
}

input,
select{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
}

.btn-primary{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
}

.btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.btn-sec{
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#0f172a;
    color:white;
    border:1px solid var(--border);
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:20px;
    font-weight:bold;
}

.Low{
    background:#14532d;
    color:#86efac;
}

.Medium{
    background:#78350f;
    color:#fde68a;
}

.High{
    background:#7f1d1d;
    color:#fca5a5;
}

.metrics{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:15px;
}

.metric-box{
    background:#0f172a;
    padding:12px;
    border-radius:8px;
}

#resultBody{
    margin-top:15px;
}

.history-item{
    padding:8px;
    border-bottom:1px solid #334155;
}

@media(max-width:900px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <div>
            <h1 class="title">Credit Risk Assessment System</h1>
            <p class="subtitle">
                Core OOP + Scikit-Learn ML + Financial Policy Engine
            </p>
        </div>

        <div>
            <button class="btn-sec" onclick="fillDemo('low')">
                Load Low-Risk Demo
            </button>
            <button class="btn-sec" onclick="fillDemo('high')">
                Load High-Risk Demo
            </button>
        </div>
    </div>

    <div class="grid">

        <!-- FORM CARD -->
        <div class="card">
            <h3>Applicant & Loan Details</h3>

            <form id="loanForm">

                <div class="form-grid">

                    <div class="full">
                        <label>Full Name</label>
                        <input type="text" id="full_name" required>
                    </div>

                    <div>
                        <label>Age</label>
                        <input type="number" id="age" min="18" max="100">
                    </div>

                    <div>
                        <label>Employment Type</label>
                        <select id="employment_type">
                            <option>Salaried</option>
                            <option>Self-employed</option>
                            <option>Business</option>
                            <option>Student</option>
                            <option>Unemployed</option>
                        </select>
                    </div>

                    <div>
                        <label>Annual Income (₹)</label>
                        <input type="number" id="annual_income">
                    </div>

                    <div>
                        <label>Existing Debt (₹)</label>
                        <input type="number" id="existing_debt">
                    </div>

                    <div>
                        <label>Loan Amount (₹)</label>
                        <input type="number" id="loan_amount">
                    </div>

                    <div>
                        <label>Loan Term (Months)</label>
                        <input type="number" id="loan_term_months">
                    </div>

                    <div>
                        <label>Credit Score</label>
                        <input type="number" id="credit_score"
                               min="300" max="900">
                    </div>

                    <div>
                        <label>Dependents</label>
                        <input type="number" id="dependents">
                    </div>

                </div>

                <button type="submit"
                        id="submitBtn"
                        class="btn-primary">
                    Assess Credit Risk
                </button>

            </form>
        </div>

        <!-- RESULT CARD -->
        <div class="card">
            <h3>Assessment Dashboard</h3>

            <div id="resultBody">
                Fill the form and click
                <b>Assess Credit Risk</b>.
            </div>

            <div id="exportRow"
                 class="btn-row"
                 style="display:none;">
                <button id="pdfBtn" class="btn-sec">
                    Download PDF Report
                </button>

                <button id="jsonBtn" class="btn-sec">
                    Download JSON Report
                </button>
            </div>
        </div>

    </div>

    <!-- HISTORY -->
    <div class="card" style="margin-top:20px;">
        <h3>Recent Checks</h3>
        <div id="historyList">
            No assessments yet.
        </div>
    </div>

</div>

<script>
function fillDemo(type){

    if(type==="low"){
        document.getElementById("full_name").value="Aarav Sharma";
        document.getElementById("age").value=31;
        document.getElementById("employment_type").value="Salaried";
        document.getElementById("annual_income").value=1200000;
        document.getElementById("existing_debt").value=40000;
        document.getElementById("loan_amount").value=350000;
        document.getElementById("loan_term_months").value=36;
        document.getElementById("credit_score").value=790;
        document.getElementById("dependents").value=1;
    }
    else{
        document.getElementById("full_name").value="Rohan Verma";
        document.getElementById("age").value=24;
        document.getElementById("employment_type").value="Unemployed";
        document.getElementById("annual_income").value=240000;
        document.getElementById("existing_debt").value=160000;
        document.getElementById("loan_amount").value=500000;
        document.getElementById("loan_term_months").value=24;
        document.getElementById("credit_score").value=480;
        document.getElementById("dependents").value=3;
    }
}
</script>

</body>
</html>
