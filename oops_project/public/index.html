<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Risk Assessment System</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 1050px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.65rem; }
    .subtitle { color: var(--muted); margin-bottom: 22px; font-size: 0.95rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 9px 11px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: var(--text);
    }
    button {
      margin-top: 16px; width: 100%; padding: 11px; border: none; border-radius: 8px;
      background: var(--accent); color: white; font-weight: 600; cursor: pointer; font-size: 0.98rem;
    }
    button.secondary { background: #334155; margin-top: 10px; }
    button:hover { opacity: 0.92; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 1.05rem; }
    .Low { background: #166534; color: #dcfce7; }
    .Medium { background: #92400e; color: #fef3c7; }
    .High { background: #991b1b; color: #fee2e2; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
    .metric-box { background: #0f172a; padding: 10px; border-radius: 8px; text-align: center; }
    .metric-box small { color: var(--muted); display: block; }
    .metric-box strong { font-size: 1.02rem; }
    .prob-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
    .flag { background: #451a1a; border-left: 3px solid #ef4444; padding: 8px 10px; margin-top: 8px; border-radius: 4px; font-size: 0.88rem; }
    .ok { background: #143322; border-left: 3px solid #22c55e; padding: 8px 10px; margin-top: 8px; border-radius: 4px; font-size: 0.88rem; }
    .history-item { padding: 8px 0; border-bottom: 1px solid #334155; font-size: 0.88rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Credit Risk Assessment System</h1>
   <div class="subtitle">Web Portal • Core OOP + Scikit-Learn ML + Financial Policy Engine (Dhruv, Yuvraj, Nakul &amp; Kashjot)</div>
    <div class="grid">
      <form class="card" id="loanForm">
        <h3 style="margin-top:0">Applicant Details</h3>
        <label>Full Name</label><input id="full_name" required value="Aarav Sharma" />
        <label>Age (18–100)</label><input id="age" type="number" min="18" max="100" required value="28" />
        <label>Annual Income (₹)</label><input id="annual_income" type="number" min="0" required value="800000" />
        <label>Employment Type</label>
        <select id="employment_type">
          <option>Salaried</option><option>Self-employed</option><option>Business</option><option>Student</option><option>Unemployed</option>
        </select>
        <label>Loan Amount Requested (₹)</label><input id="loan_amount" type="number" min="1" required value="500000" />
        <label>Loan Term (months)</label><input id="loan_term_months" type="number" min="1" required value="36" />
        <label>Credit Score (300–900)</label><input id="credit_score" type="number" min="300" max="900" required value="720" />
        <label>Existing Debt (₹)</label><input id="existing_debt" type="number" min="0" required value="100000" />
        <label>Dependents</label><input id="dependents" type="number" min="0" required value="1" />
        <button type="submit" id="submitBtn">Assess Credit Risk</button>
      </form>

      <div>
        <div class="card">
          <h3 style="margin-top:0">Assessment Result</h3>
          <div id="resultBody" style="color: var(--muted)">Submit the form to run ML prediction + policy checks.</div>
          <button type="button" id="downloadBtn" class="secondary" style="display:none">Download JSON Report</button>
        </div>

        <div class="card" style="margin-top: 20px;">
          <h3 style="margin-top:0">Recent Checks (Browser Session)</h3>
          <div id="historyList" style="color: var(--muted)">No assessments yet.</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const historyKey = "credit_risk_history_v1";
    let latestReport = null;

    function renderHistory() {
      const items = JSON.parse(localStorage.getItem(historyKey) || "[]");
      const box = document.getElementById("historyList");
      if (!items.length) { box.textContent = "No assessments yet."; return; }
      box.innerHTML = items.map(i =>
        `<div class="history-item"><strong>${i.name}</strong> • ₹${Number(i.loan).toLocaleString("en-IN")} • <strong>${i.risk}</strong> (${i.score}/100)</div>`
      ).join("");
    }

    document.getElementById("downloadBtn").addEventListener("click", () => {
      if (!latestReport) return;
      const blob = new Blob([JSON.stringify(latestReport, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${latestReport.application_id || "credit_report"}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("loanForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const dlBtn = document.getElementById("downloadBtn");
      btn.textContent = "Assessing..."; btn.disabled = true;

      const payload = {
        full_name: document.getElementById("full_name").value,
        age: Number(document.getElementById("age").value),
        annual_income: Number(document.getElementById("annual_income").value),
        employment_type: document.getElementById("employment_type").value,
        loan_amount: Number(document.getElementById("loan_amount").value),
        loan_term_months: Number(document.getElementById("loan_term_months").value),
        credit_score: Number(document.getElementById("credit_score").value),
        existing_debt: Number(document.getElementById("existing_debt").value),
        dependents: Number(document.getElementById("dependents").value),
      };

      try {
        const res = await fetch("/api/assess", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");

        latestReport = data.report;
        dlBtn.style.display = "block";

        const f = data.financials;
        const p = data.probabilities || {};
        const flagsHtml = f.policy_passed
          ? `<div class="ok">All banking policy guardrails passed.</div>`
          : f.policy_flags.map(msg => `<div class="flag">${msg}</div>`).join("");

        document.getElementById("resultBody").innerHTML = `
          <span class="badge ${data.risk_level}">${data.risk_level} Risk</span>
          <span style="margin-left:10px;color:var(--muted)">Score: <strong>${data.risk_score}/100</strong></span>
          <div class="prob-row">
            <span>Low: ${( (p.Low || 0) * 100 ).toFixed(1)}%</span>
            <span>Medium: ${( (p.Medium || 0) * 100 ).toFixed(1)}%</span>
            <span>High: ${( (p.High || 0) * 100 ).toFixed(1)}%</span>
          </div>
          <div class="metrics">
            <div class="metric-box"><small>Est. EMI</small><strong>₹${f.monthly_emi.toLocaleString("en-IN")}</strong></div>
            <div class="metric-box"><small>Debt-to-Income</small><strong>${f.dti_percent}%</strong></div>
            <div class="metric-box"><small>Loan-to-Income</small><strong>${f.lti_ratio}x</strong></div>
          </div>
          ${flagsHtml}
          <p style="font-size:0.9rem; line-height:1.45; margin-top:12px;">${data.recommendation}</p>
        `;

        const prev = JSON.parse(localStorage.getItem(historyKey) || "[]");
        prev.unshift({ name: payload.full_name, loan: payload.loan_amount, risk: data.risk_level, score: data.risk_score });
        localStorage.setItem(historyKey, JSON.stringify(prev.slice(0, 6)));
        renderHistory();
      } catch (err) {
        dlBtn.style.display = "none";
        document.getElementById("resultBody").innerHTML = `<div class="flag">${err.message}</div>`;
      } finally {
        btn.textContent = "Assess Credit Risk"; btn.disabled = false;
      }
    });

    renderHistory();
  </script>
</body>
</html>
